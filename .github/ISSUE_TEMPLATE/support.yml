name: Public support problem
description: Report a reproducible problem that does not require private account evidence.
title: "[Support] "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing problem knowledge first. Do not post credentials, private identifiers, customer/order data, private financial evidence, or raw private logs.
  - type: input
    id: problem_id
    attributes:
      label: Problem ID
      description: Stable ASC.* or AMZ.* ID if known. Leave unknown if classification is needed.
      placeholder: unknown
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: What do you see?
      description: Describe the customer-visible symptom without private account data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks already performed
      description: Include public articles/diagnostics checked and sanitized results.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-safety confirmation
      options:
        - label: This report contains no credentials, secrets, private account/customer/order identifiers, raw private logs, or other sensitive evidence.
          required: true
